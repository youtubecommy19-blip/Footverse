<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FOOTVERSE ⚽ Football Battle, Quiz, Dream Team and Penalty Game</title>
<meta name="description" content="FOOTVERSE is a free football site: vote in Football Battle, take the quiz, build your Dream Team, shoot penalties and grow your own player.">
<meta name="robots" content="index,follow">
<meta name="theme-color" content="#06100b">
<meta property="og:type" content="website">
<meta property="og:site_name" content="FOOTVERSE">
<meta property="og:title" content="FOOTVERSE ⚽ Football games, quiz and dream team">
<meta property="og:description" content="Vote for your favourite players, test your knowledge, build your XI and take penalties.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E⚽%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#06100b;--card:#0e2017;--line:#1d4030;--g:#2ee37f;--g2:#0f8f4b;--tx:#e9f7ef;--mu:#8fb09d;--bad:#ff5d5d;--gold:#f2c94c;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:rgba(6,16,11,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{max-width:980px;margin:auto;display:flex;align-items:center;gap:12px;padding:8px 14px}
.logo{font:italic 800 28px/1 "Barlow Condensed",Impact,sans-serif;color:var(--g);background:none;border:0;cursor:pointer;padding:0;flex:none}
nav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
nav button{flex:none;background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:14px;white-space:nowrap}
nav button.act{background:var(--g);color:#04140b;border-color:var(--g);font-weight:700}
main{max-width:980px;margin:auto;padding:16px 14px 40px}
.sec{display:none}.sec.on{display:block}
h2{font:italic 800 clamp(30px,7vw,44px)/1 "Barlow Condensed",Impact,sans-serif;margin:8px 0 4px}
h3{margin:4px 0 12px;font-size:20px}
.mu{color:var(--mu)}
.hero{position:relative;overflow:hidden;border-radius:18px;border:1px solid var(--line);padding:36px 20px;margin-bottom:16px;background:linear-gradient(180deg,rgba(6,16,11,.1),rgba(6,16,11,.8)),repeating-linear-gradient(90deg,#0d2c1b 0 56px,#0a2418 56px 112px)}
.hero::after{content:"";position:absolute;right:-70px;top:50%;width:240px;height:240px;margin-top:-120px;border:2px solid rgba(46,227,127,.28);border-radius:50%}
.hero h1{position:relative;z-index:1;font:italic 800 clamp(52px,15vw,110px)/.9 "Barlow Condensed",Impact,sans-serif;margin:0 0 10px}
.hero p{position:relative;z-index:1;max-width:460px;color:#c6e4d3;margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.hc{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer}
.hc:hover{border-color:var(--g)}
.hc b{display:block;font-size:17px;margin-bottom:4px}
.hc span{color:var(--mu);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.btn{background:var(--g);color:#04140b;border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer}
.btn.alt{background:transparent;color:var(--g);border:1px solid var(--g2)}
.btn:hover{filter:brightness(1.1)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch;margin:12px 0}
.vs>i{align-self:center;font:italic 800 28px "Barlow Condensed",Impact,sans-serif;color:var(--gold)}
.pl{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 8px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.av{width:56px;height:56px;border-radius:50%;background:var(--g2);display:grid;place-items:center;font:italic 800 30px "Barlow Condensed",Impact,sans-serif}
.rt{font:italic 800 34px/1 "Barlow Condensed",Impact,sans-serif;color:var(--g)}
.rl{display:flex;justify-content:space-between;margin-top:8px}
.tr{height:12px;background:#12281d;border-radius:6px;overflow:hidden}
.tr i{display:block;height:100%;background:var(--g);transition:width .5s}
.opt{display:block;width:100%;text-align:left;background:#0a1711;border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0;cursor:pointer}
.opt:hover{border-color:var(--g)}
.opt.ok{background:#12593a;border-color:var(--g)}
.opt.no{background:#5a1d1d;border-color:var(--bad)}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.tab,.chip{background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 13px;cursor:pointer}
.tab.act{background:var(--g);color:#04140b;border-color:var(--g);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip b{color:var(--g)}
.pitch{display:flex;flex-direction:column;gap:16px;padding:16px 4px;border:2px solid #1f5a3d;border-radius:12px;background:repeating-linear-gradient(0deg,#0d2c1b 0 44px,#0a2418 44px 88px)}
.row{display:flex;justify-content:space-around}
.slot{width:68px;height:68px;border-radius:50%;border:2px dashed var(--g2);background:rgba(6,16,11,.65);font-size:11px;line-height:1.1;font-weight:600;padding:2px;overflow-wrap:anywhere;cursor:pointer}
.slot.f{border-style:solid;background:var(--g2)}
.slot.sel{outline:3px solid var(--gold)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 8px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--mu);font-weight:600;font-size:14px}
tr:nth-child(2) td:first-child,tr:nth-child(3) td:first-child,tr:nth-child(4) td:first-child{color:var(--gold);font-weight:700}
.pk{position:relative;height:280px;max-width:520px;margin:12px auto;border-radius:12px;background:linear-gradient(180deg,#0a1f15 70%,#0d3a22 70%)}
.net{position:absolute;inset:0 6% auto;height:70%;display:grid;grid-template:1fr 1fr/repeat(3,1fr);border:4px solid #e9f7ef;border-bottom:0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.06) 0 2px,transparent 2px 10px)}
.net button{background:none;border:1px dashed rgba(255,255,255,.2);cursor:pointer}
.net button:hover{background:rgba(46,227,127,.18)}
.ball,.gk{position:absolute;transform:translate(-50%,-50%);transition:left .45s ease,top .45s ease;font-size:34px;pointer-events:none}
.gk{font-size:42px}
.sc,.msg{text-align:center;margin:8px 0}
.msg{font-weight:700;min-height:28px}
.form{display:grid;gap:12px}
.form label{display:grid;gap:6px;color:var(--mu)}
input,select{background:#0a1711;border:1px solid var(--line);border-radius:10px;padding:11px;width:100%}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin:12px 0}
.stats div{background:#0a1711;border-radius:10px;padding:8px}
.stats b{display:block;font-size:20px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.en{height:10px;background:#12281d;border-radius:5px;overflow:hidden}
.en i{display:block;height:100%;background:var(--gold)}
footer{text-align:center;color:var(--mu);font-size:13px;padding:0 14px 24px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="bar"><button class="logo" onclick="show('home')">FOOTVERSE ⚽</button><nav id="nav"></nav></div></header>
<main>
<section id="home" class="sec on">
<div class="hero"><h1>FOOTVERSE</h1><p>Vote for your favourite players, test your knowledge, build your XI, take penalties and grow your own star.</p><button class="btn" onclick="show('battle')">Start with the Battle</button></div>
<div class="grid" id="cards"></div>
</section>
</main>
<footer>FOOTVERSE ⚽ Demo version. Ratings are sample values, and your votes and progress are saved on this device only.</footer>
<script>
const P="Courtois,GK,89;Alisson,GK,89;Donnarumma,GK,88;Van Dijk,DEF,89;Rúben Dias,DEF,88;Saliba,DEF,87;Rüdiger,DEF,87;Alexander-Arnold,DEF,86;Hakimi,DEF,85;Theo Hernández,DEF,85;Rodri,MID,91;De Bruyne,MID,91;Bellingham,MID,90;Pedri,MID,88;Valverde,MID,88;Musiala,MID,88;Ødegaard,MID,88;Modrić,MID,87;Messi,FWD,94;Ronaldo,FWD,91;Mbappé,FWD,91;Haaland,FWD,91;Kane,FWD,90;Vinícius Jr,FWD,90;Salah,FWD,89;Yamal,FWD,88;Lewandowski,FWD,88;Neymar,FWD,87".split(";").map(s=>{const[n,p,r]=s.split(",");return{n,p,r:+r}});
const $=id=>document.getElementById(id);
const S={get(k,d){try{const v=localStorage.getItem("fv_"+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem("fv_"+k,JSON.stringify(v))}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const SECS=[["battle","Battle ⚔️","Football Battle ⚔️","Pick the player you prefer and vote."],["quiz","Quiz 🧠","Football Quiz 🧠","10 questions, 10 points for each correct answer."],["dream","Dream Team 🏆","Dream Team 🏆","Choose a formation and fill the pitch."],["rank","Rankings 📊","Football Rankings 📊","Player ratings and fan votes."],["pen","Penalty 🎮","Penalty Game 🎮","5 shots. Beat the keeper."],["career","Career 🌟","My Football Career 🌟","Create a player and grow his rating."]];
const R={};
SECS.forEach(([id,nav,title,desc])=>{
 const s=document.createElement("section");s.id=id;s.className="sec";
 s.innerHTML=`<h2>${title}</h2><p class="mu">${desc}</p><div id="${id}B"></div>`;
 document.querySelector("main").appendChild(s);
 const b=document.createElement("button");b.textContent=nav;b.dataset.id=id;b.onclick=()=>show(id);$("nav").appendChild(b);
 const c=document.createElement("button");c.className="hc";c.innerHTML=`<b>${title}</b><span>${desc}</span>`;c.onclick=()=>show(id);$("cards").appendChild(c);
});
function show(id){
 document.querySelectorAll(".sec").forEach(s=>s.classList.toggle("on",s.id==id));
 document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("act",b.dataset.id==id));
 if(R[id])R[id]();window.scrollTo(0,0);
}

/* Battle */
const pi=n=>P.findIndex(p=>p.n==n);
let bi=[pi("Messi"),pi("Ronaldo")],bv=false;
R.battle=rBattle;
function rBattle(){
 const[a,b]=bi.map(i=>P[i]),v=S.get("bv",{}),c=v[bi.join()]||[0,0];
 const A=c[0]+a.r,B=c[1]+b.r,pa=Math.round(A*100/(A+B)),pb=100-pa;
 const card=(p,i)=>`<div class="pl"><div class="av">${p.n[0]}</div><b>${p.n}</b><span class="mu">${p.p}</span><span class="rt">${p.r}</span>${bv?"":`<button class="btn" onclick="vote(${i})">Vote</button>`}</div>`;
 $("battleB").innerHTML=`<div class="vs">${card(a,0)}<i>VS</i>${card(b,1)}</div>`+
 (bv?`<div class="card"><div class="rl"><span>${a.n}</span><b>${pa}%</b></div><div class="tr"><i style="width:${pa}%"></i></div><div class="rl"><span>${b.n}</span><b>${pb}%</b></div><div class="tr"><i style="width:${pb}%"></i></div><p class="mu">Thanks for voting. Results start from player ratings and grow with every vote.</p></div>`:`<p class="mu">Vote to see the results.</p>`)+
 `<button class="btn alt" onclick="nextBattle()">Next battle</button>`;
}
function vote(i){
 const v=S.get("bv",{}),k=bi.join();v[k]=v[k]||[0,0];v[k][i]++;S.set("bv",v);
 const f=S.get("fan",{}),n=P[bi[i]].n;f[n]=(f[n]||0)+1;S.set("fan",f);bv=true;rBattle();
}
function nextBattle(){
 let i,j;do{i=Math.random()*P.length|0;j=Math.random()*P.length|0}while(i==j);
 bi=i<j?[i,j]:[j,i];bv=false;rBattle();
}

/* Quiz */
const Q=[["Who won the 2022 FIFA World Cup?",["France","Argentina","Croatia","Brazil"],1],["Which country has won the most World Cups?",["Germany","Italy","Brazil","Argentina"],2],["How many players per team are on the pitch?",["9","10","11","12"],2],["Which club is nicknamed the Red Devils?",["Liverpool","Manchester United","Arsenal","Roma"],1],["Who has won the most Ballon d’Or awards?",["Cristiano Ronaldo","Lionel Messi","Johan Cruyff","Michel Platini"],1],["Where was the 2018 World Cup held?",["Qatar","Brazil","Russia","Germany"],2],["Which club plays at Camp Nou?",["Real Madrid","Barcelona","Valencia","Sevilla"],1],["How long is a standard match without extra time?",["80 minutes","90 minutes","100 minutes","120 minutes"],1],["Which country won Euro 2024?",["England","Spain","France","Germany"],1],["Which player is nicknamed the Egyptian King?",["Sadio Mané","Mohamed Salah","Riyad Mahrez","Achraf Hakimi"],1]];
let qs=[],qi=0,qc=0,ql=false;
R.quiz=rQuiz;
function qStart(){qs=[...Q].sort(()=>Math.random()-.5);qi=0;qc=0;ql=false;rQuiz()}
function rQuiz(){
 const el=$("quizB");
 if(!qs.length){el.innerHTML=`<div class="card"><p>Answer 10 football questions and see your final score.</p><p class="mu">Best score: ${S.get("qbest",0)}</p><button class="btn" onclick="qStart()">Start quiz</button></div>`;return}
 if(qi>=qs.length){
  if(qc>S.get("qbest",0))S.set("qbest",qc);
  const m=qc>=80?"Legend! You know your football.":qc>=50?"Solid performance. Try again for a higher score.":"Keep training and try again.";
  el.innerHTML=`<div class="card"><h3>Your score: ${qc} / ${qs.length*10}</h3><p>${m}</p><p class="mu">Best score: ${S.get("qbest",0)}</p><button class="btn" onclick="qStart()">Play again</button></div>`;return;
 }
 const q=qs[qi];
 el.innerHTML=`<div class="card"><p class="mu">Question ${qi+1} of ${qs.length}. Score: ${qc}</p><h3>${q[0]}</h3>${q[1].map((o,i)=>`<button class="opt" onclick="qAns(${i})">${o}</button>`).join("")}</div>`;
}
function qAns(i){
 if(ql)return;ql=true;const q=qs[qi],b=document.querySelectorAll(".opt");
 b[q[2]].classList.add("ok");if(i!=q[2])b[i].classList.add("no");else qc+=10;
 setTimeout(()=>{qi++;ql=false;rQuiz()},900);
}

/* Dream Team */
const F={"4-3-3":[4,3,3],"4-4-2":[4,4,2],"3-5-2":[3,5,2]};
let fm="4-3-3",lu={},sel=null;
R.dream=rDream;
const slots=()=>{const[d,m,f]=F[fm];return[["GK",1],["DEF",d],["MID",m],["FWD",f]]};
function rDream(){
 const used=Object.values(lu),n=used.length,avg=n?Math.round(used.reduce((s,x)=>s+P.find(p=>p.n==x).r,0)/n):"-";
 const rows=slots().reverse().map(([r,c])=>`<div class="row">${Array.from({length:c},(_,i)=>{const k=r+i,p=lu[k];return`<button class="slot${p?" f":""}${sel==k?" sel":""}" onclick="dPick('${k}')">${p||r}</button>`}).join("")}</div>`).join("");
 let pick="";
 if(sel){const r=sel.replace(/\d/g,"");pick=`<div class="card"><p class="mu">Choose a player (${r})</p><div class="chips">${P.filter(p=>p.p==r&&!used.includes(p.n)).map(p=>`<button class="chip" onclick="dSet('${p.n}')">${p.n} <b>${p.r}</b></button>`).join("")}${lu[sel]?`<button class="chip" onclick="dSet(null)">Remove player</button>`:""}</div></div>`}
 $("dreamB").innerHTML=`<div class="tabs">${Object.keys(F).map(f=>`<button class="tab${f==fm?" act":""}" onclick="dFm('${f}')">${f}</button>`).join("")}<button class="tab" onclick="dAuto()">Auto-fill best XI</button><button class="tab" onclick="dClear()">Clear</button></div><div class="pitch">${rows}</div><p>Players placed: <b>${n}/11</b>. Team rating: <b>${avg}</b></p>${pick}`;
}
function dPick(k){sel=sel==k?null:k;rDream()}
function dSet(n){if(n)lu[sel]=n;else delete lu[sel];sel=null;rDream()}
function dFm(f){fm=f;lu={};sel=null;rDream()}
function dClear(){lu={};sel=null;rDream()}
function dAuto(){lu={};sel=null;slots().forEach(([r,c])=>P.filter(p=>p.p==r).sort((a,b)=>b.r-a.r).slice(0,c).forEach((p,i)=>lu[r+i]=p.n));rDream()}

/* Rankings */
let rs="r";
R.rank=rRank;
function rRank(){
 const f=S.get("fan",{}),L=[...P].sort((a,b)=>rs=="r"?b.r-a.r:(f[b.n]||0)-(f[a.n]||0)||b.r-a.r);
 $("rankB").innerHTML=`<div class="tabs"><button class="tab${rs=="r"?" act":""}" onclick="rs='r';rRank()">By rating</button><button class="tab${rs=="v"?" act":""}" onclick="rs='v';rRank()">By fan votes</button></div><div class="tw"><table><tr><th>#</th><th>Player</th><th>Pos</th><th>Rating</th><th>Votes</th></tr>${L.map((p,i)=>`<tr><td>${i+1}</td><td>${p.n}</td><td>${p.p}</td><td>${p.r}</td><td>${f[p.n]||0}</td></tr>`).join("")}</table></div><p class="mu">Fan votes come from the Battle section.</p>`;
}

/* Penalty */
const ZX=[20.7,50,79.3],ZY=[17.5,52.5];
let ps=0,pg=0,pb=false,pm="Pick a corner of the goal to shoot.";
R.pen=rPen;
function rPen(){
 const d=ps>=5;
 $("penB").innerHTML=`<p class="sc">Shot ${Math.min(ps+1,5)} of 5. Score: <b>${pg*10}</b>. Best: <b>${S.get("pbest",0)}</b></p><div class="pk"><div class="net">${[0,1,2,3,4,5].map(z=>`<button aria-label="Shoot at zone ${z+1}" onclick="shoot(${z})"></button>`).join("")}</div><div class="gk" id="gk" style="left:50%;top:36%">🧤</div><div class="ball" id="ball" style="left:50%;top:90%">⚽</div></div><p class="msg" id="pm">${d?"Full time! You scored "+pg*10+" points.":pm}</p>${d?`<div style="text-align:center"><button class="btn" onclick="pReset()">Play again</button></div>`:""}`;
}
function shoot(z){
 if(pb||ps>=5)return;pb=true;
 const kz=Math.random()*6|0,miss=Math.random()<.12,bl=$("ball"),gk=$("gk");
 bl.style.left=ZX[z%3]+"%";bl.style.top=(miss?-6:ZY[z/3|0])+"%";
 gk.style.left=ZX[kz%3]+"%";gk.style.top=ZY[kz/3|0]+"%";
 setTimeout(()=>{
  ps++;
  if(miss)pm="Over the bar! No goal.";else if(kz==z)pm="Saved by the keeper!";else{pg++;pm="GOAL! +10 points"}
  $("pm").textContent=pm;
  if(ps>=5&&pg*10>S.get("pbest",0))S.set("pbest",pg*10);
  setTimeout(()=>{pb=false;rPen()},900);
 },550);
}
function pReset(){ps=0;pg=0;pm="Pick a corner of the goal to shoot.";rPen()}

/* Career */
const GP={"Striker":.6,"Winger":.45,"Attacking midfielder":.4,"Midfielder":.2,"Defender":.08,"Goalkeeper":0};
const tt=r=>r<65?"Rookie":r<75?"Pro":r<85?"Star":r<92?"World class":"Legend";
R.career=rCareer;
function rCareer(){
 const c=S.get("career",null),el=$("careerB");
 if(!c){el.innerHTML=`<div class="card form"><label>Player name<input id="cn" maxlength="20" placeholder="Your player"></label><label>Position<select id="cp">${Object.keys(GP).map(p=>`<option>${p}</option>`).join("")}</select></label><button class="btn" onclick="cStart()">Start career</button></div>`;return}
 el.innerHTML=`<div class="card"><div class="pl" style="border:0;background:none"><div class="av">${esc(c.n)[0]||"P"}</div><b>${esc(c.n)}</b><span class="mu">${esc(c.p)}, ${tt(c.r)}</span><span class="rt">${c.r}</span></div><div class="stats"><div><b>${17+Math.floor(c.m/10)}</b>Age</div><div><b>${c.m}</b>Matches</div><div><b>${c.g}</b>Goals</div></div><p class="mu" style="margin:0 0 4px">Energy ${c.e}%</p><div class="en"><i style="width:${c.e}%"></i></div><div class="acts"><button class="btn" onclick="cAct('train')">Train</button><button class="btn" onclick="cAct('play')">Play match</button><button class="btn alt" onclick="cAct('rest')">Rest</button></div><p>${esc(c.log)}</p></div><button class="btn alt" onclick="cReset()">Start a new career</button>`;
}
function cStart(){
 const n=$("cn").value.trim()||"Rookie";
 S.set("career",{n,p:$("cp").value,r:60,e:100,m:0,g:0,log:"Your career begins. Train or play your first match."});rCareer();
}
function cAct(t){
 const c=S.get("career",null);if(!c)return;const k=c.r>85?.5:1;
 if(t=="rest"){c.e=100;c.log="You rested. Energy is full."}
 else if(t=="train"){
  if(c.e<20)c.log="Too tired to train. Rest first.";
  else{c.e-=20;const d=Math.round((1+Math.random()*2)*k);c.r=Math.min(99,c.r+d);c.log=`Training finished. Rating +${d}.`}
 }else{
  if(c.e<30)c.log="Too tired to play. Rest first.";
  else{
   c.e-=30;c.m++;
   const g=Math.random()<(GP[c.p]||0)?1+(Math.random()<.25?1:0):0,a=g+(Math.random()*3|0),b=Math.random()*4|0;
   const d=Math.round(([0,1,1,2,2,3][Math.random()*6|0]+g)*k);
   c.r=Math.min(99,c.r+d);c.g+=g;
   c.log=`Match ${c.m}: ${a>b?"win":a==b?"draw":"loss"} ${a}-${b}. Your goals: ${g}. Rating +${d}.`;
  }
 }
 S.set("career",c);rCareer();
}
function cReset(){try{localStorage.removeItem("fv_career")}catch(e){}rCareer()}
